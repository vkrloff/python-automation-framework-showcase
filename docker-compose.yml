services:
  juice-shop:
    # Pinned release: test results must not change because "latest" moved.
    image: bkimminich/juice-shop:v20.4.0
    container_name: juice-shop
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      # Image is distroless (no shell/curl/wget) -> probe with the bundled node binary.
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - >-
          fetch('http://localhost:3000/rest/admin/application-version')
          .then(r => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
